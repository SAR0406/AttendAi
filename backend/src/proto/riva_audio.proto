// Riva Audio format definitions.
// Adapted from the NVIDIA Riva open-source proto files.

syntax = "proto3";

package nvidia.riva.audio;

option cc_enable_arenas = true;
option java_multiple_files = true;
option java_outer_classname = "RivaAudioProto";
option java_package = "ai.riva";

// AudioEncoding specifies the encoding of the audio bytes in the encapsulated
// message.
enum AudioEncoding {
  // Not specified.
  ENCODING_UNSPECIFIED = 0;

  // Uncompressed 16-bit signed little-endian samples (Linear PCM).
  LINEAR_PCM = 1;

  // FLAC (Free Lossless Audio Codec) is the recommended encoding because it is
  // lossless--therefore recognition is not compromised--and requires only about
  // half the bandwidth of LINEAR_PCM. FLAC stream encoding supports 16-bit and
  // 24-bit samples; however, not all fields in STREAMINFO are supported.
  FLAC = 2;

  // 8-bit samples that compand 8-bit audio samples using G.711 PCMU/mu-law.
  MULAW = 3;

  // Opus encoded audio frames in an Ogg container
  // The decoder will use the codec natively, and all default codec options
  // will be used.
  OGGOPUS = 4;
}
